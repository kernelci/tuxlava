device_type: "dragonboard-845c"

job_name: "tuxlava@fastboot-oe-dragonboard-845c: boot"
priority: low
visibility: "public"

reboot_to_fastboot: false


context:
    test_character_delay: 10
timeouts:
  job:
    minutes: 80
  connection:
    minutes: 2
  actions:
    power-off:
      seconds: 30
    finalize:
      seconds: 60

actions:
- deploy:
    to: fastboot
    docker:
      image: "linaro/kir:20260611"
      local: true
    timeout:
      minutes: 25
    os: debian
    images:
      partition:0:
        url: "https://images.validation.linaro.org/snapshots.linaro.org/96boards/dragonboard845c/linaro/rescue/28/dragonboard-845c-bootloader-ufs-linux-28/gpt_both0.bin"
      boot:
        url: "https://storage.tuxboot.com/buildroot/arm64/boot.img"
      rootfs:
        url: "https://storage.tuxboot.com/debian/20250326/trixie/arm64/rootfs.tar.xz"
        compression: xz
        sparse: false
        format: tar

- command:
    name: pre_os_command
- command:
    name: pre_power_command
- boot:
    docker:
      image: "linaro/kir:20260611"
      local: true
    method: fastboot
    timeout:
      minutes: 25
    auto_login:
      login_prompt: 'login:'
      username: root
    prompts:
    - 'root@(.*):[/~]#'
    - "root@qcom-armv8a:"
