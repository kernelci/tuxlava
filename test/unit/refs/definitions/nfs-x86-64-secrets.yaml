device_type: "x86_64"

job_name: "tuxlava@nfs-x86_64: boot"
priority: low
visibility: "public"

context:
    test_character_delay: 10
    extra_kernel_args: 'rootwait'

timeouts:
  job:
    minutes: 55
  connection:
    minutes: 2
  actions:
    power-off:
      seconds: 60
    finalize:
      seconds: 60

actions:
- deploy:
    to: tftp
    timeout:
      minutes: 30
    os: debian
    kernel:
      url: "https://example.com/Image.gz"
      headers:
        "Authorization": "Bearer all"
      compression: gz
      type: image
    nfsrootfs:
      url: "https://example.com/rootfs.tar.xz"
      headers:
        "Authorization": "Bearer rootfs"
      compression: xz
      format: tar
      overlays:
        overlay-00:
          url: "https://example.com/ltp.tar.xz"
          path: "/"
          headers:
            "Authorization": "Bearer all"
          format: tar
          compression: xz
- boot:
    method:
      ipxe
    commands: nfs
    parameters:
      shutdown-message: 'reboot: Restarting system'
    timeout:
      minutes: 15
    auto_login:
      login_prompt: 'login:'
      username: root
    prompts:
    - 'root@(.*):[/~]#'
    - '/ #'

- test:
    timeout:
      minutes: 5
    definitions:
    - from: inline
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: storage-prep
          description: "Prepare scratch storage"
        run:
          steps:
          - export STORAGE_DEV=$(lava-target-storage SATA || lava-target-storage USB)
          - test -n "$STORAGE_DEV" || lava-test-raise "STORAGE_DEV not found; job exit"
          - mkfs.ext4 -F -E nodiscard "$STORAGE_DEV" || lava-test-raise "mkfs.ext4 $STORAGE_DEV failed; job exit"
          - mkdir -p /scratch && mount "$STORAGE_DEV" /scratch || lava-test-raise "mount $STORAGE_DEV failed; job exit"
          - df -h
          - mount
      name: storage-prep-inline
      path: inline/storage-prep.yaml

- test:
    timeout:
      minutes: 5
    definitions:
    - from: inline
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: storage-teardown
          description: "Sync and unmount scratch storage"
        run:
          steps:
          - sync
          - umount /scratch || true
      name: storage-teardown-inline
      path: inline/storage-teardown.yaml
