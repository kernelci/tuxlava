
device_type: "qrb2210-rb1"

job_name: "tuxlava@flasher-qrb2210-rb1: boot"
priority: low
visibility: "public"


context:
    test_character_delay: 10
    lava_test_results_dir: /home/lava-%s

timeouts:
  job:
    minutes: 80
  connection:
    minutes: 2
  actions:
    power-off:
      seconds: 60
    finalize:
      seconds: 120

actions:
- deploy:
    to: downloads
    timeout:
      minutes: 25
    os: debian
    images:
      image:
        headers:
          "PRIVATE-TOKEN": "glpat"
        url: "http://example.com/flasher.tar.gz"
    postprocess:
      docker:
        image: "ghcr.io/foundriesio/lava-lmp-sign:main"
        local: true
        steps:
        - export IMAGE_PATH=$PWD
        - cp overlay*.tar.gz overlay.tar.gz
        - echo "OVERLAY=overlay.tar.gz" >> $IMAGE_PATH/flash.settings
        - echo "OVERLAY_PATH=/home/" >> $IMAGE_PATH/flash.settings
        - echo "DEVICE_TYPE=qrb2210-rb1" >> $IMAGE_PATH/flash.settings
        - cat $IMAGE_PATH/flash.settings
- deploy:
    to: flasher
    os: debian
    timeout:
      minutes: 30
    images:
      image:
        url: downloads://flasher.tar.gz
      settings:
        url: downloads://flash.settings
      overlay:
        url: downloads://overlay.tar.gz

- boot:
    method: minimal
    timeout:
      minutes: 25
    auto_login:
      login_prompt: 'login:'
      username: root
    prompts:
    - 'root@(.*):[/~]#'
