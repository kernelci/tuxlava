device_type: "x86_64"

job_name: "tuxlava@nfs-x86_64: boot"
priority: low
visibility: "public"

context:
    test_character_delay: 10
    extra_kernel_args: 'rootwait'

timeouts:
  job:
    minutes: 45
  connection:
    minutes: 2
  actions:
    power-off:
      seconds: 60
    finalize:
      seconds: 60

actions:
- deploy:
    to: tftp
    timeout:
      minutes: 30
    os: debian
    kernel:
      url: "https://example.com/Image.gz"
      headers:
        "Authorization": "Bearer all"
      compression: gz
      type: image
    ramdisk:
      url: "https://example.com/rootfs.cpio.gz"
      headers:
        "Authorization": "Bearer all"
      compression: gz
- boot:
    method:
      ipxe
    commands: ramdisk
    parameters:
      shutdown-message: 'reboot: Restarting system'
    timeout:
      minutes: 15
    auto_login:
      login_prompt: 'login:'
      username: root
    prompts:
    - 'root@(.*):[/~]#'
    - '/ #'
